name: CI - Tests and Validation

on:
  push:
    branches: [ main, develop, Mohammed ]
  pull_request:
    branches: [ main, Mohammed ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pylint
        pip install -r requirements.txt

    - name: Run Black (Code Formatting Check)
      run: |
        black --check --diff *.py || true

    - name: Run Flake8 (Linting)
      run: |
        flake8 *.py --max-line-length=120 --ignore=E501,W503 || true

    - name: Run Pylint
      run: |
        pylint *.py --disable=C0111,C0103,R0913,R0914 || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        pytest test_api.py -v --cov=api --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  data-validation:
    name: Data Quality Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data validation
      run: |
        python scripts/validate_data.py

  model-validation:
    name: Model Performance Validation
    runs-on: ubuntu-latest
    needs: [unit-tests, data-validation]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run model validation
      run: |
        python scripts/validate_model.py

    - name: Check model metrics
      run: |
        echo "Model validation completed. Check logs for metrics."

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: model-validation

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start API server
      run: |
        uvicorn api:app --host 0.0.0.0 --port 8000 &
        sleep 10

    - name: Test API endpoints
      run: |
        curl -X GET http://localhost:8000/health
        curl -X GET http://localhost:8000/metrics
